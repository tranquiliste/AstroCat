name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm spec/Selune-macos.spec

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Selune.app" \
            "Selune-macOS-AppleSilicon.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Selune-macOS-AppleSilicon
          path: Selune-macOS-AppleSilicon.zip

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --clean --noconfirm spec/Selune-macos.spec

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Selune.app" \
            "Selune-macOS-Intel.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Selune-macOS-Intel
          path: Selune-macOS-Intel.zip
